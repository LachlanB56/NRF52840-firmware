; PlatformIO Project Configuration File — Metric Firmware nRF52
;
; Stage 1: bare toolchain bring-up on the Nordic nRF52840-DK.
; Bring-up target now; the final board is an nRF52832 (Laird/Ezurio BL652
; module) — see README.md for what will need to change when we move to it.

[env:nrf52840_dk]
platform = nordicnrf52
board = nrf52840_dk
framework = arduino          ; pulls in the Adafruit nRF52 Arduino core
monitor_speed = 115200
upload_protocol = nrfjprog   ; uses the DK's on-board J-Link debug probe
